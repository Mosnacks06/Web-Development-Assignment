<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - NOVA</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Assets/Styles/login.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg fixed-top bg-dark navbar-dark px-4 py-3">
    <div class="container-fluid p-0">
      <a class="navbar-brand me-auto" href="Index.html"><label class="nova-font" style="cursor:pointer">NOVA</label></a>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
          <form class="d-flex flex-grow-1 mx-4" role="search">
            <input class="form-control" type="search" placeholder="Search" aria-label="Search">
          </form>
          <ul class="navbar-nav d-flex flex-row align-items-center gap-2 ms-auto">
            <li class="nav-item"><a class="nav-link" href="Index.html"><i class="fa-solid fa-house fa-2x"></i></a></li>
            <li class="nav-item"><a class="nav-link" href="account.html"><i class="fa-solid fa-circle-user fa-2x"></i></a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-heart fa-2x"></i><span class="badge-count">0</span></a></li>
            <li class="nav-item"><a class="nav-link" href="#"><i class="fa-solid fa-basket-shopping fa-2x"></i><span class="badge-count">0</span></a></li>
            <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
          </ul>
        </div>
      </div>
      <a href="login.html" class="Login-Button active">Login</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <main class="login-page">
    <section class="login-visual" aria-label="NOVA outdoor gear"></section>

    <section class="login-panel">
      <div class="login-card">
        <p class="eyebrow">Welcome Back</p>
        <h1>Login</h1>
        <p class="login-copy">Sign in to view your account, orders, saved items, and payment details.</p>

        <form id="loginForm" novalidate>
          <div class="field">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="field">
            <label for="loginPassword">Password</label>
            <div class="password-wrap">
              <input type="password" id="loginPassword" placeholder="Enter your password" autocomplete="current-password">
              <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="login-options">
            <label class="remember">
              <input type="checkbox" id="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#">Forgot password?</a>
          </div>

          <p class="form-message" id="formMessage" aria-live="polite"></p>

          <button type="submit" class="btn-login">
            <i class="fa-solid fa-right-to-bracket"></i> Login
          </button>
        </form>

        <p class="signup-note">New to NOVA? <a href="account.html">Create an account</a></p>
      </div>
    </section>
  </main>

  <script src="scripts/login.js"></script>
</body>
</html>
